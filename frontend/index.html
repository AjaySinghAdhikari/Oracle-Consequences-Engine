<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ORACLE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <!-- Progress bar fixed at top -->
  <div id="progress-bar-container">
    <div id="progress-bar"></div>
  </div>
  <div id="pipeline-status"></div>

  <!-- INPUT SECTION -->
  <section id="input-section">
    <header id="main-header">
      <h1 id="oracle-title">ORACLE</h1>
      <p id="oracle-subtitle">SECOND-ORDER CONSEQUENCES ENGINE</p>
    </header>

    <div id="input-container">
      <textarea id="decision-input" placeholder="Describe your decision..."></textarea>
      <div id="divider-line"></div>
    </div>

    <div id="examples-row">
      <button class="example-btn" data-text="Drop out to start a startup">Drop out to start a startup</button>
      <span class="dot">·</span>
      <button class="example-btn" data-text="Quit my job">Quit my job</button>
      <span class="dot">·</span>
      <button class="example-btn" data-text="Take the investor money">Take the investor money</button>
      <span class="dot">·</span>
      <button class="example-btn" data-text="Confront my co-founder">Confront my co-founder</button>
      <span class="dot">·</span>
      <button class="example-btn" data-text="Move to another city">Move to another city</button>
    </div>

    <button id="consult-btn">CONSULT ORACLE</button>
  </section>

  <!-- RESULTS SECTION -->
  <section id="results-section" class="hidden">

    <div id="results-header">
      <h1 id="results-title">ORACLE</h1>
      <div id="decision-display"></div>
    </div>

    <div id="results-body">
      <div id="section-cartographer" class="result-section hidden"></div>
      <div id="section-historian" class="result-section hidden"></div>
      <div id="section-simulator" class="result-section hidden"></div>
      <div id="section-advocate" class="result-section hidden"></div>
      <div id="section-reframer" class="result-section hidden"></div>
      <div id="section-verdict" class="result-section hidden"></div>
      <div id="section-tree" class="result-section hidden"></div>
    </div>

  </section>

  <!-- NEW DECISION button -->
  <button id="new-decision-btn" class="hidden">NEW DECISION</button>

  <script src="/static/d3.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
